<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Login | Gifty Hamper</title>
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body class="admin-login-body">
  <main class="admin-login-wrap">
    <section class="admin-login-card">
      <div class="admin-login-brand">
        <img src="assets/gifty-hampers-landscape.png" alt="Gifty Hamper">
        <p class="eyebrow">Secure admin access</p>
        <h1>Welcome back.</h1>
      </div>

      <p class="admin-login-subtitle">Sign in with an authorised Gifty Hamper account to access the admin panel.</p>

      <form id="admin-login-form" class="admin-login-form">
        <label class="admin-login-field">
          Email address
          <input id="admin-email" type="email" autocomplete="username" required placeholder="admin@example.com">
        </label>

        <label class="admin-login-field">
          Password
          <input id="admin-password" type="password" autocomplete="current-password" required placeholder="Your password">
        </label>

        <button id="admin-login-submit" class="admin-login-submit" type="submit">Sign in</button>

        <button id="admin-reset-password" class="admin-login-reset" type="button">Forgot password?</button>

        <p id="admin-login-message" class="admin-login-message" aria-live="polite"></p>
      <div id="provider-contact" hidden style="margin-top:18px;padding:16px;border:1px solid #eadde5;border-radius:12px;background:#fff8fb;text-align:center;">
        <strong style="display:block;margin-bottom:6px;">Admin access has expired.</strong>
        <span style="display:block;color:#6f6877;line-height:1.5;">Kindly contact the Web Developer / Provider to renew the Owner account.</span>
        <a href="https://wa.me/918667298507" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;font-weight:700;color:#6f2b78;">WhatsApp: +91 8667298507 (Ashish)</a>
      </div>
      </form>

      <p class="admin-login-footer"><a href="index.html">← Back to Gifty Hamper</a></p>
    </section>
  </main>

  <script type="module" src="js/admin-login.js?v=3"></script>
</body>
</html>
